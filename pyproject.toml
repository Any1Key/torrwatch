[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "torrwatch"
version = "0.1.0"
description = "Self-hosted monitoring for explicitly added torrent releases."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TorrWatch contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "httpx[socks]>=0.28,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
torrwatch = "torrwatch.cli:main"
torrwatch-web = "torrwatch.main:run"
torrwatch-worker = "torrwatch.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["torrwatch"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["torrwatch"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cryptography.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=torrwatch --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["torrwatch"]

[tool.coverage.report]
show_missing = true
skip_covered = false
