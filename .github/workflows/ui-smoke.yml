name: UI smoke checks

on:
  pull_request:
    paths:
      - 'torrwatch/web/**'
      - 'torrwatch/services/admin.py'
      - 'scripts/check_ui_templates.py'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Jinja2
        run: python -m pip install 'Jinja2>=3.1,<4'
      - name: Compile Python modules
        run: python -m compileall -q torrwatch
      - name: Check Jinja templates and local UI assets
        run: python scripts/check_ui_templates.py
