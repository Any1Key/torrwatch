services:
  flaresolverr:
    container_name: torrwatch-flaresolverr
    # Byparr exposes the FlareSolverr-compatible /v1 API and currently handles
    # the tracker challenges that Chromium-based FlareSolverr cannot pass.
    image: torrwatch-browser-solver:local
    build:
      context: ./docker/byparr
    environment:
      BROWSER_LOCALE: ru-RU
      BROWSER_TIMEZONE: Europe/Moscow
      LOG_LEVEL: warning
    shm_size: "1gb"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    # The image's built-in probe opens a real browser and creates unnecessary
    # traffic every few minutes. TorrWatch checks the API when refreshing.
    healthcheck:
      disable: true

  web:
    container_name: torrwatch-web
    image: ${TORRWATCH_IMAGE:-ruslanchikt/torrwatch:latest}
    init: true
    command: ["torrwatch-web"]
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    ports:
      - "172.16.60.98:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    container_name: torrwatch-worker
    image: ${TORRWATCH_IMAGE:-ruslanchikt/torrwatch:latest}
    command: ["torrwatch-worker"]
    init: true
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      flaresolverr:
        condition: service_started
