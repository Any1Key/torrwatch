services:
  flaresolverr:
    # Reuse the FlareSolverr image already present on this NAS. Pinning the
    # digest also prevents an unattended update from changing browser behavior.
    image: ghcr.io/flaresolverr/flaresolverr@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    environment:
      # FlareSolverr logs request bodies at info level; bodies may contain
      # authentication cookies, so keep this private service at error level.
      LOG_LEVEL: error
      TZ: Europe/Moscow
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    image: torrwatch:dev
    command: ["torrwatch-web"]
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    ports:
      - "172.16.60.98:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    image: torrwatch:dev
    command: ["torrwatch-worker"]
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    volumes:
      - ./data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      flaresolverr:
        condition: service_started
