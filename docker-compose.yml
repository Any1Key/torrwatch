services:
  flaresolverr:
    # Reuse the FlareSolverr image already present on this NAS. Pinning the
    # digest also prevents an unattended update from changing browser behavior.
    image: ghcr.io/flaresolverr/flaresolverr@sha256:139dfee1c6f89249c8d665d1333a42e8ec74ec0a86bc6bb1c8461e10d3a66a47
    environment:
      # English locale is recommended for stable Cloudflare challenge parsing.
      LANG: en_US.UTF-8
      # Keep request bodies and browser details out of persistent logs.
      LOG_LEVEL: error
      TZ: Europe/Moscow
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: ${TORRWATCH_IMAGE:-ruslanchikt/torrwatch:latest}
    init: true
    command: ["torrwatch-web"]
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    ports:
      - "172.16.60.98:8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: ${TORRWATCH_IMAGE:-ruslanchikt/torrwatch:latest}
    command: ["torrwatch-worker"]
    init: true
    env_file: ${TORRWATCH_ENV_FILE:-.env}
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
      flaresolverr:
        condition: service_started
