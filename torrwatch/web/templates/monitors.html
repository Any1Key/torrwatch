{% extends "base.html" %}{% block content %}<h2>Мониторы</h2><p><a href="/monitors/new">Добавить монитор</a></p><table><thead><tr><th>Имя</th><th>Трекер</th><th>Статус</th><th>Следующая проверка</th></tr></thead><tbody>{% for item in monitors %}<tr><td><a href="/monitors/{{ item.id }}">{{ item.name }}</a></td><td>{{ item.plugin_id }}</td><td>{{ item.status }}</td><td>{{ item.next_check_at or "—" }}</td></tr>{% else %}<tr><td colspan="4">Мониторов пока нет.</td></tr>{% endfor %}</tbody></table>{% endblock %}
