<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TorrWatch{% endblock %}</title>
    <style>body{font-family:system-ui,sans-serif;margin:auto;max-width:1100px;padding:1rem}nav{display:flex;gap:.8rem;flex-wrap:wrap}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:.45rem;text-align:left}input{display:block;margin:.3rem 0 1rem;min-width:18rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1rem}.card{border:1px solid #ccc;padding:1rem} .error{color:#a00}</style>
  </head>
  <body>
    <header><h1><a href="/">TorrWatch</a></h1><nav aria-label="Основная навигация"><a href="/monitors">Мониторы</a><a href="/trackers">Трекеры</a><a href="/tracker-accounts">Аккаунты</a><a href="/proxies">Прокси</a><a href="/clients">Клиенты</a><a href="/notifications">Уведомления</a><a href="/events">События</a><a href="/settings">Настройки</a><a href="/system">Система</a></nav><p>Вы вошли как {{ username }}.</p></header>
    <main>{% block content %}{% endblock %}</main>
    <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button type="submit">Выйти</button></form>
  </body>
</html>
