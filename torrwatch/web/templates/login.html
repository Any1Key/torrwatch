<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/admin.css?v=15">
    <title>Вход — TorrWatch</title>
  </head>
  <body class="login-page">
    <main class="login-center">
      <section class="login-card" aria-label="Вход в TorrWatch">
        <div class="login-card-brand"><span class="brand-icon">T</span><span>TorrWatch</span></div>
        <h1>Вход</h1>
        <p class="login-card-subtitle">Войдите в панель управления раздачами.</p>
        {% if error %}<p class="alert login-card-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login" class="login-card-form">
          <input type="hidden" name="csrf" value="{{ csrf_token }}">
          <div class="field"><label for="username">Имя администратора</label><input id="username" name="username" autocomplete="username" placeholder="Имя пользователя" autofocus required></div>
          <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Пароль" required></div>
          <label class="login-card-remember"><input type="checkbox" name="remember"><span>Запомнить меня на 30 дней</span></label>
          <button class="login-card-submit" type="submit">Войти</button>
        </form>
        <p class="login-card-footer">TorrWatch · Локальная панель</p>
      </section>
    </main>
  </body>
</html>
