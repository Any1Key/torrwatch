<!doctype html>
<html lang="ru">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/admin.css"><title>Вход — TorrWatch</title></head>
  <body>
    <main class="login-shell card">
      <h1>TorrWatch</h1>
      <p class="muted">Войдите для управления раздачами и подключениями.</p>
      {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <div class="field"><label for="username">Имя администратора</label><input id="username" name="username" autocomplete="username" required></div>
        <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <label class="remember"><input type="checkbox" name="remember"> Запомнить меня на 30 дней</label>
        <button type="submit">Войти</button>
      </form>
    </main>
  </body>
</html>
